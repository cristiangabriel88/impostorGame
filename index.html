<!doctype html>
<html lang="ro">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
	<title>Impostor</title>

	<style>
		:root {
			--bg0: #070A12;
			--bg1: #0B1020;
			--card: rgba(255, 255, 255, .06);
			--card2: rgba(255, 255, 255, .09);
			--stroke: rgba(255, 255, 255, .10);
			--text: rgba(255, 255, 255, .92);
			--muted: rgba(255, 255, 255, .66);
			--accent: #7C5CFF;
			--accent2: #21D4FD;
			--danger: #FF4D6D;
			--shadow: 0 18px 60px rgba(0, 0, 0, .55);
			--radius: 22px;
		}

		* {
			box-sizing: border-box;
			-webkit-tap-highlight-color: transparent;
		}

		html,
		body {
			height: 100%;
			margin: 0;
			font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
			color: var(--text);
			background: radial-gradient(1200px 900px at 20% 10%, rgba(124, 92, 255, .25), transparent 55%),
				radial-gradient(900px 700px at 80% 20%, rgba(33, 212, 253, .18), transparent 55%),
				radial-gradient(900px 700px at 50% 90%, rgba(255, 77, 109, .12), transparent 60%),
				linear-gradient(180deg, var(--bg0), var(--bg1));
			overflow-x: hidden;
			overflow-y: auto;
			touch-action: manipulation;
		}

		.screen {
			height: 100%;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			text-align: center;
			user-select: none;
			/* padding-bottom: 90px; */
		}

		.wrap {
			width: min(560px, 100%);
			margin-top: 5%;
		}

		.card {
			position: relative;
			background: linear-gradient(180deg, var(--card), rgba(255, 255, 255, .035));
			border: 1px solid var(--stroke);
			border-radius: var(--radius);
			box-shadow: var(--shadow);
			padding: 26px 20px;
			backdrop-filter: blur(10px);
		}

		.brand {
			display: flex;
			align-items: baseline;
			justify-content: center;
			gap: 10px;
			margin-bottom: 10px;
		}

		.logo {
			transform: translateY(-6px);
		}

		.kofiWrap {
			margin-top: 20px;
			display: flex;
			justify-content: center;
			opacity: 0.85;
			transition: opacity .2s ease, transform .2s ease;
		}

		.kofiWrap:hover {
			opacity: 1;
			transform: translateY(-1px);
		}

		.kofiWrap img {
			height: 40px;
			border: 0;
		}


		.logo {
			width: 14px;
			height: 14px;
			border-radius: 999px;
			background: radial-gradient(circle at 30% 30%, #fff, rgba(255, 255, 255, .15) 35%, transparent 60%),
				linear-gradient(135deg, var(--accent), var(--accent2));
			box-shadow: 0 0 0 4px rgba(124, 92, 255, .18), 0 12px 30px rgba(124, 92, 255, .18);
		}

		.title {
			font-size: 38px;
			font-weight: 850;
			letter-spacing: .3px;
			margin: 4px 0 2px;
		}

		.subtitle {
			color: var(--muted);
			font-size: 15px;
			margin: 0 0 18px;
			line-height: 1.35;
		}

		.row {
			display: flex;
			gap: 12px;
			align-items: center;
			justify-content: center;
			flex-wrap: wrap;
			margin-top: 10px;
		}

		.column {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 12px;
			justify-content: center;
			margin-top: 10px;
		}


		.field {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 12px 14px;
			background: linear-gradient(180deg, rgba(255, 255, 255, .085), rgba(255, 255, 255, .04));
			border: 1px solid rgba(255, 255, 255, .10);
			border-radius: 18px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
		}

		.field label {
			font-size: 14px;
			color: var(--muted);
		}

		input[type="number"] {
			width: 90px;
			border: 0;
			outline: 0;
			padding: 6px 8px;
			font-size: 22px;
			font-weight: 800;
			color: var(--text);
			background: transparent;
			text-align: center;
			appearance: textfield;
		}

		input[type="number"]::-webkit-outer-spin-button,
		input[type="number"]::-webkit-inner-spin-button {
			-webkit-appearance: none;
			margin: 0;
		}

		.btn {
			border: 0;
			cursor: pointer;
			margin-top: 10px;
			padding: 14px 18px;
			border-radius: 18px;
			font-size: 16px;
			font-weight: 850;
			letter-spacing: .2px;
			color: #0b0f1c;
			background: linear-gradient(135deg, var(--accent), var(--accent2));
			box-shadow: 0 14px 40px rgba(33, 212, 253, .18), 0 16px 50px rgba(124, 92, 255, .16);
			transform: translateY(0);
			transition: transform .12s ease, filter .12s ease;
			min-width: 160px;
		}

		.bottomControls {
			margin-top: 20px;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 10px;
		}

		.topRow {
			display: flex;
			gap: 12px;
		}

		.btn:active {
			transform: translateY(1px);
			filter: brightness(.95);
		}

		.hint {
			margin-top: 14px;
			color: var(--muted);
			font-size: 14px;
			line-height: 1.4;
		}

		.topbar {
			position: fixed;
			top: 14px;
			left: 14px;
			right: 14px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			pointer-events: none;
			font-size: 13px;
			color: rgba(255, 255, 255, .68);
		}

		.pill {
			pointer-events: none;
			padding: 8px 12px;
			border-radius: 999px;
			border: 1px solid rgba(255, 255, 255, .12);
			background: rgba(0, 0, 0, .25);
			backdrop-filter: blur(8px);
		}

		.link {
			pointer-events: auto;
			cursor: pointer;
			padding: 8px 12px;
			border-radius: 999px;
			border: 1px solid rgba(255, 255, 255, .12);
			background: rgba(0, 0, 0, .25);
			backdrop-filter: blur(8px);
			text-decoration: none;
			color: rgba(255, 255, 255, .82);
		}

		.link:active {
			filter: brightness(.95);
		}

		.big {
			font-size: clamp(44px, 7vw, 70px);
			font-weight: 950;
			letter-spacing: .6px;
			margin: 4px 0 0;
		}

		.word {
			background: linear-gradient(135deg, rgba(255, 255, 255, .92), rgba(255, 255, 255, .62));
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
			text-shadow: 0 18px 60px rgba(0, 0, 0, .35);
		}

		.sub {
			margin-top: 12px;
			font-size: 15px;
			color: rgba(255, 255, 255, .72);
		}

		.tapArea {
			width: 100%;
		}

		.blackout {
			background: #000;
		}

		.blackout .pill,
		.blackout .link {
			background: rgba(255, 255, 255, .08);
			border-color: rgba(255, 255, 255, .14);
			color: rgba(255, 255, 255, .90);
		}

		.blackout .card {
			background: rgba(255, 255, 255, .05);
			border-color: rgba(255, 255, 255, .10);
		}

		.doneGrid {
			display: flex;
			gap: 12px;
			justify-content: center;
			flex-wrap: wrap;
			margin-top: 16px;
		}

		.btn2 {
			border: 1px solid rgba(255, 255, 255, .14);
			background: rgba(255, 255, 255, .06);
			color: rgba(255, 255, 255, .9);
			box-shadow: none;
			min-width: 160px;
		}

		ul {
			list-style: none;
			padding-left: 0;
		}

		li {
			display: flex;
			align-items: flex-start;
			gap: 10px;
			line-height: 1.6;
		}

		li::before {
			content: "•";
			margin-top: 0.1em;
			color: currentColor;
		}

		.flagBtn {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 12px 16px;
			min-width: 64px;
		}

		.flagImg {
			width: 28px;
			height: 20px;
			object-fit: contain;
			display: block;
		}

		.playerControl {
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.stepBtn {
			width: 44px;
			height: 44px;
			border-radius: 14px;
			border: 1px solid rgba(255, 255, 255, .14);
			background: rgba(255, 255, 255, .06);
			color: rgba(255, 255, 255, .92);
			font-size: 22px;
			font-weight: 900;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.stepBtn:active {
			filter: brightness(.95);
			transform: translateY(1px);
		}

		.playerValue {
			min-width: 56px;
			text-align: center;
			font-size: 22px;
			font-weight: 900;
		}

		.playerSelect {
			border: 0;
			outline: 0;
			background: transparent;
			color: var(--text);
			font-size: 20px;
			font-weight: 850;
			padding: 6px 8px;
			appearance: auto;
		}

		.playerSelect option {
			color: #111;
		}

		.wordInput {
			width: 240px;
			max-width: 70vw;
			border: 1px solid rgba(255, 255, 255, .14);
			border-radius: 16px;
			background: rgba(255, 255, 255, .06);
			color: var(--text);
			padding: 12px 14px;
			font-size: 16px;
			font-weight: 750;
			outline: none;
		}

		.wordInput::placeholder {
			color: rgba(255, 255, 255, .55);
		}

		.tapArea {
			width: 100%;
			cursor: pointer;
			touch-action: manipulation;
		}

		.tapArea .card {
			cursor: pointer;
		}

		.passOverlay {
			position: fixed;
			inset: 0;
			background: #000;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			z-index: 9999;
			color: #fff;
			user-select: none;
			pointer-events: all;
			text-align: center;
			padding: 24px;
		}

		.passOverlayTitle {
			font-size: clamp(32px, 8vw, 72px);
			font-weight: 950;
			letter-spacing: 0.14em;
		}

		.passOverlayCountdown {
			margin-top: 14px;
			font-size: clamp(18px, 3vw, 26px);
			font-weight: 800;
			letter-spacing: 0.06em;
			opacity: 0.85;
		}

		.kofiPitch {
			margin-top: 14px;
			font-size: 17px;
			line-height: 1.35;
			color: rgba(255, 255, 255, .74);
		}

		input[type="number"] {
			width: 50px;
			border: 0;
			outline: 0;
			padding: 6px 8px;
			font-size: 22px;
			font-weight: 800;
			color: var(--text);
			background: transparent;
			text-align: center;
			appearance: textfield;
		}

		.wordInputWrap {
			position: relative;
			width: 240px;
			max-width: 70vw;
		}

		.wordInput {
			width: 100%;
			padding-right: 44px;
		}

		.randomBtn {
			position: absolute;
			right: 8px;
			top: 47%;
			transform: translateY(-50%);
			border: 0;
			background: transparent;
			font-size: 20px;
			cursor: pointer;
			color: rgba(255, 255, 255, .7);
			padding: 6px;
		}

		.randomBtn:active {
			transform: translateY(-50%) scale(0.95);
		}

		#creatorMark {
			position: static;
			display: block;
			width: fit-content;
			margin: 10px auto calc(env(safe-area-inset-bottom, 0px) + 10px);
			font-size: 22px;
			line-height: 1;
			color: rgba(255, 255, 255, .55);
			text-decoration: none;
			z-index: 20;
			padding: 10px;
			opacity: 0;
			pointer-events: none;
			transition: opacity .2s ease;
		}

		#creatorMark.visible {
			opacity: .65;
			pointer-events: auto;
			animation: markPulseFast 2.2s ease-in-out infinite;
		}

		#creatorMark:active {
			opacity: 1;
		}

		@keyframes markPulseFast {
			0% {
				text-shadow:
					0 0 6px rgba(124, 92, 255, .15),
					0 0 10px rgba(33, 212, 253, .08);
			}

			50% {
				text-shadow:
					0 0 18px rgba(124, 92, 255, .55),
					0 0 32px rgba(33, 212, 253, .25);
			}

			100% {
				text-shadow:
					0 0 6px rgba(124, 92, 255, .15),
					0 0 10px rgba(33, 212, 253, .08);
			}
		}

		.finishBadge {
			width: clamp(96px, 18vw, 140px);
			height: clamp(96px, 18vw, 140px);
			margin: 6px auto 14px;
			border-radius: 999px;
			display: grid;
			place-items: center;
			background:
				radial-gradient(circle at 30% 30%, rgba(255, 255, 255, .55), rgba(255, 255, 255, .08) 32%, transparent 60%),
				linear-gradient(135deg, #39ff88, #18c46c);
			box-shadow:
				0 0 0 10px rgba(57, 255, 136, .12),
				0 0 0 1px rgba(255, 255, 255, .18) inset,
				0 20px 70px rgba(0, 0, 0, .55),
				0 18px 60px rgba(57, 255, 136, .22);
			animation: finishPulse 2.8s ease-in-out infinite;
		}

		.finishBadge svg {
			width: 62%;
			height: 62%;
			filter: drop-shadow(0 10px 22px rgba(0, 0, 0, .45));
		}

		.finishBadge path {
			stroke: rgba(10, 14, 20, .95);
			stroke-width: 10;
			stroke-linecap: round;
			stroke-linejoin: round;
			fill: none;
		}

		@keyframes finishPulse {
			0% {
				transform: scale(1);
				box-shadow:
					0 0 0 10px rgba(57, 255, 136, .10),
					0 0 0 1px rgba(255, 255, 255, .18) inset,
					0 14px 34px rgba(57, 255, 136, .16);
			}

			50% {
				transform: scale(1.055);
				box-shadow:
					0 0 0 16px rgba(57, 255, 136, .18),
					0 0 0 1px rgba(255, 255, 255, .22) inset,
					0 18px 44px rgba(57, 255, 136, .22);
			}

			100% {
				transform: scale(1);
				box-shadow:
					0 0 0 10px rgba(57, 255, 136, .10),
					0 0 0 1px rgba(255, 255, 255, .18) inset,
					0 14px 34px rgba(57, 255, 136, .16);
			}
		}

		.finishCard {
			padding-top: 22px;
		}

		.finishKicker {
			font-size: 13px;
			letter-spacing: .18em;
			text-transform: uppercase;
			color: rgba(255, 255, 255, .70);
			margin-top: 6px;
		}

		.finishTitle {
			font-size: 3rem;
			font-weight: 300;
			font-family: "Titan One", sans-serif;
			font-weight: 200;
			font-style: normal;
			letter-spacing: 2px;
			margin-top: 2rem;
			margin-left: 10px;
			background: linear-gradient(135deg, rgba(255, 255, 255, .92), rgba(255, 255, 255, .65));
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
			text-shadow: 0 18px 60px rgba(0, 0, 0, .28);
		}

		.finishMeta {
			margin-top: 12px;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			flex-wrap: wrap;
		}

		.finishPill {
			padding: 8px 12px;
			border-radius: 999px;
			border: 1px solid rgba(255, 255, 255, .12);
			background: rgba(0, 0, 0, .18);
			backdrop-filter: blur(8px);
			color: rgba(255, 255, 255, .78);
			font-size: 13px;
		}

		.finishDot {
			opacity: .45;
		}

		.voteCard {
			padding-top: 22px;
		}

		.voteTitle {
			font-size: 30px;
			font-weight: 950;
			letter-spacing: .3px;
			margin-top: 10px;
		}

		.voteSub {
			margin-top: 10px;
			color: rgba(255, 255, 255, .72);
			font-size: 14px;
			line-height: 1.35;
		}

		.voteForm {
			margin-top: 30px;
			margin-bottom: 30px;
			display: flex;
			flex-direction: column;
			gap: 10px;
			justify-content: center;
			align-items: center;
		}

		.voteInput {
			width: min(320px, 86vw);
			border: 1px solid rgba(255, 255, 255, .14);
			border-radius: 18px;
			background: rgba(255, 255, 255, .06);
			color: rgba(255, 255, 255, .92);
			padding: 14px 16px;
			font-size: 16px;
			font-weight: 900;
			letter-spacing: .08em;
			text-transform: uppercase;
			outline: none;
		}

		.voteInput::placeholder {
			color: rgba(255, 255, 255, .45);
			text-transform: none;
			letter-spacing: 0;
			font-weight: 750;
		}

		.voteProgress {
			margin-top: 14px;
			display: flex;
			justify-content: center;
			gap: 10px;
			flex-wrap: wrap;
		}

		.voteChip {
			padding: 8px 12px;
			border-radius: 999px;
			border: 1px solid rgba(255, 255, 255, .12);
			background: rgba(0, 0, 0, .18);
			backdrop-filter: blur(8px);
			color: rgba(255, 255, 255, .78);
			font-size: 13px;
		}

		.resultsList {
			margin-top: 18px;
			display: grid;
			gap: 10px;
			text-align: left;
		}

		.resultRow {
			display: grid;
			grid-template-columns: 28px 1fr auto;
			gap: 20px;
			align-items: center;
			padding: 20px 14px;
			border-radius: 18px;
			border: 1px solid rgba(255, 255, 255, .12);
			background: linear-gradient(180deg, rgba(255, 255, 255, .065), rgba(255, 255, 255, .03));
		}

		.rankBadge {
			width: 35px;
			height: 35px;
			border-radius: 12px;
			display: grid;
			place-items: center;
			font-weight: 950;
			color: rgba(255, 255, 255, .92);
			border: 1px solid rgba(255, 255, 255, .14);
			background: rgba(0, 0, 0, .18);
		}

		.resultMain {
			display: grid;
			margin-left: 10px;
			gap: 6px;
		}

		.resultName {
			font-weight: 950;
			letter-spacing: .06em;
			color: rgba(255, 255, 255, .92);
			text-transform: uppercase;
		}

		.resultBar {
			height: 10px;
			border-radius: 999px;
			background: rgba(255, 255, 255, .08);
			border: 1px solid rgba(255, 255, 255, .10);
			overflow: hidden;
		}

		.resultBarFill {
			height: 100%;
			border-radius: 999px;
			background: linear-gradient(135deg, var(--accent), var(--accent2));
			width: 0%;
		}

		.resultVotes {
			font-weight: 950;
			color: rgba(255, 255, 255, .86);
			min-width: 56px;
			text-align: right;
		}

		.resultRow.winner {
			border-color: rgba(57, 255, 136, .28);
			background: linear-gradient(180deg, rgba(57, 255, 136, .14), rgba(255, 255, 255, .03));
			box-shadow: 0 18px 60px rgba(57, 255, 136, .12);
			animation: winnerPulse 2.6s ease-in-out infinite;
		}

		.rankBadge.winner {
			background: linear-gradient(135deg, #39ff88, #18c46c);
			border-color: rgba(255, 255, 255, .22);
			color: rgba(10, 14, 20, .95);
			box-shadow:
				0 0 0 8px rgba(57, 255, 136, .14),
				0 14px 40px rgba(57, 255, 136, .18);
			animation: winnerBadgePulse 2.2s ease-in-out infinite;
		}

		@keyframes winnerPulse {
			0% {
				transform: translateY(0);
			}

			50% {
				transform: translateY(-1px);
			}

			100% {
				transform: translateY(0);
			}
		}

		@keyframes winnerBadgePulse {
			0% {
				transform: scale(1);
				filter: brightness(1);
			}

			50% {
				transform: scale(1.08);
				filter: brightness(1.08);
			}

			100% {
				transform: scale(1);
				filter: brightness(1);
			}
		}

		.column>.field {
			width: 20rem;
			justify-content: space-between;
		}

		.column>.field .playerControl {
			margin-left: auto;
		}
	</style>
</head>

<body>
	<div id="app" class="screen"></div>

		function tallyVotes(list) {
			const map = new Map();
			for (const raw of list) {
				const name = normalizeVoteName(raw);
				if (!name) continue;
				map.set(name, (map.get(name) || 0) + 1);
			}
			const arr = Array.from(map.entries()).map(([name, count]) => ({ name, count }));
			arr.sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
			return arr;
		}

			app.className = "screen";

			wireTopbar();

			const submitVote = () => {
				const name = normalizeVoteName(input.value);
				if (!name) {
					input.focus();
					return;
				}

				votes.push(name);

				if (voteIndex >= N) {
					phase = "results";
					render();
					return;
				}

				voteIndex += 1;
				showPassOverlayAndAdvanceVote();
			};

			input.addEventListener("input", () => {
				input.value = normalizeVoteName(input.value);
			});

			input.addEventListener("keydown", (e) => {
				if (e.key === "Enter") submitVote();
			});

			submit.onclick = submitVote;

			setTimeout(() => input.focus(), 0);

		function showPassOverlayAndAdvanceVote() {
			const durationSec = 3;

			const overlay = document.createElement("div");
			overlay.className = "passOverlay";

			const title = document.createElement("div");
			title.className = "passOverlayTitle";
			title.textContent = t("passOverlayTitle");

			const countdown = document.createElement("div");
			countdown.className = "passOverlayCountdown";

			overlay.appendChild(title);
			overlay.appendChild(countdown);
			document.body.appendChild(overlay);

			let remaining = durationSec;
			countdown.textContent = `${remaining} ${t("passOverlaySeconds")}`;

			const interval = setInterval(() => {
				remaining -= 1;
				if (remaining <= 0) {
					clearInterval(interval);
					overlay.remove();
					render();
					return;
				}
				countdown.textContent = `${remaining} ${t("passOverlaySeconds")}`;
			}, 1000);
		}

		function renderResults() {
			const rows = tallyVotes(votes);

		function randInt(min, max) {
			return Math.floor(Math.random() * (max - min + 1)) + min;
		}

		let lastWord = "";

		function pickWord() {
			const list = LANG === "ro" ? WORDS_RO : WORDS_EN;
			if (!list.length) return "";

			let w = list[randInt(0, list.length - 1)];
			if (list.length === 1) return w;

			let tries = 0;
			while (w === lastWord && tries < 20) {
				w = list[randInt(0, list.length - 1)];
				tries++;
			}

			lastWord = w;
			return w;
		}

		function toTitleCase(s) {
			s = (s || "").trim();
			if (!s) return s;
			if (s.includes(" ")) return s;
			return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
		}

		function startGame() {
			N = clampPlayersValue(N || 5);

			const cw = normalizeWordInput(customWord);
			word = cw ? cw : toTitleCase(pickWord());

			impostorSet = new Set();
			impostorCount = clampImpostorsValue(impostorCount);

			while (impostorSet.size < impostorCount) {
				impostorSet.add(randInt(1, N));
			}

			currentPlayer = 1;
			phase = "hide";
			render();
		}

		function clampPlayersValue(n) {
			n = Number(n || 0);
			if (!Number.isFinite(n)) n = 5;
			if (n < 3) n = 3;
			if (n > 99) n = 99;
			return n;
		}

		function renderPlayersControl() {

			const current = clampPlayersValue(N || 5);

						min="3"

						step="1"
						value="${current}"

					/>
				`;

			const input = document.getElementById("playersInput");

			input.oninput = () => {
				let v = (input.value || "").replace(/[^\d]/g, "");
				if (v.length > 2) v = v.slice(0, 2);
				if (v && Number(v) > 99) v = "99";
				input.value = v;
				N = clampPlayersValue(v);
				localStorage.setItem(STORAGE_PLAYERS, String(N));
			};

			input.onblur = () => {
				N = clampPlayersValue(input.value);
				input.value = String(N);
			};

			input.onkeydown = (e) => {
				if (e.key === "Enter") {
					N = clampPlayersValue(input.value);
					input.value = String(N);
					input.blur();
				}
			};
		}


		function setPlayers(delta) {
			N = clampPlayersValue((N || 5) + delta);

			localStorage.setItem(STORAGE_PLAYERS, String(N));

			const input = document.getElementById("playersInput");

			const num = document.getElementById("playersNumber");
			if (num) num.textContent = String(N);
		}

		function clampImpostorsValue(k) {
			k = Number(k || 0);
			if (!Number.isFinite(k)) k = 1;
			if (k < 1) k = 1;

			const players = clampPlayersValue(N || 5);
			const max = Math.max(1, players - 1);
			if (k > max) k = max;

			return k;
		}

							<div class="finishBadge" aria-hidden="true">
								<svg viewBox="0 0 64 64" role="img" aria-label="Done">
									<path d="M16 34 L28 46 L50 20"></path>
								</svg>
							</div>

							<div class="finishTitle">${t("doneTitle")}</div>

							<div class="doneGrid" style="margin-top:18px;">
								<button id="vote" class="btn">${t("vote")}</button>
								<button id="backSetup" class="btn btn2">${t("back")}</button>
								
							</div>
						</div>

						<div class="bottomControls">
							<div class="kofiPitch">${t("kofiPitch")}</div>
							<div class="kofiWrap">
								<a href="https://ko-fi.com/s/1bd08ce885" target="_blank" rel="noopener noreferrer">
									<img src="https://storage.ko-fi.com/cdn/kofi5.png" alt="${t("kofiAlt")}" />
								</a>
							</div>
						</div>
					</div>
				`;

			const newRoundBtn = document.getElementById("newRound");
			if (newRoundBtn) newRoundBtn.onclick = () => {
				useCustomWordUI = false;
				customWord = "";
				localStorage.removeItem(STORAGE_CUSTOM_WORD);
				localStorage.setItem(STORAGE_CUSTOM_UI, "0");
				startGame();
			};

			const backSetupBtn = document.getElementById("backSetup");
			if (backSetupBtn) backSetupBtn.onclick = () => {
				useCustomWordUI = false;
				customWord = "";
				localStorage.removeItem(STORAGE_CUSTOM_WORD);
				localStorage.setItem(STORAGE_CUSTOM_UI, "0");
				phase = "setup";
				render();
			};

			const voteBtn = document.getElementById("vote");
			if (voteBtn) voteBtn.onclick = () => startVoting();
		}


		function showPassOverlayAndAdvance() {
			const durationSec = 3;

			const overlay = document.createElement("div");
			overlay.className = "passOverlay";

			const title = document.createElement("div");
			title.className = "passOverlayTitle";
			title.textContent = t("passOverlayTitle");

			const countdown = document.createElement("div");
			countdown.className = "passOverlayCountdown";

			overlay.appendChild(title);
			overlay.appendChild(countdown);
			document.body.appendChild(overlay);

			let remaining = durationSec;
			countdown.textContent = `${remaining} ${t("passOverlaySeconds")}`;

			const interval = setInterval(() => {
				remaining -= 1;
				if (remaining <= 0) {
					clearInterval(interval);
					overlay.remove();
					nextPhase();
					return;
				}
				countdown.textContent = `${remaining} ${t("passOverlaySeconds")}`;
			}, 1000);
		}


		function render() {
			if (phase === "intro") renderIntro();
			else if (phase === "instructions") renderInstructions();
			else if (phase === "setup") renderSetup();
			else if (phase === "hide") renderHide();
			else if (phase === "reveal") renderReveal();
			else if (phase === "done") renderDone();
			else if (phase === "vote") renderVote();
			else if (phase === "results") renderResults();

			updateCreatorMark();
		}


		function nextPhase() {
			if (phase === "hide") {
				phase = "reveal";
				render();
				return;
			}
			if (phase === "reveal") {
				if (currentPlayer >= N) phase = "done";
				else { currentPlayer += 1; phase = "hide"; }
				render();
				return;
			}
		}

		let lastTap = 0;
		function guardedTap() {
			const now = Date.now();
			if (now - lastTap < 250) return;
			lastTap = now;

			if (phase === "reveal") {
				showPassOverlayAndAdvance();
				return;
			}

			nextPhase();
		}

		window.addEventListener("DOMContentLoaded", () => {
			render();
		});
	</script>



</body>

</html>
